// calculator using form
<!DOCTYPE html>
<html>
<head>
  <title>Simple Calculator</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 100px;
    }
    form {
      display: inline-block;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 10px;
    }
    input {
      padding: 5px;
      margin: 10px;
    }
  </style>
</head>
<body>

  <h2>Simple Calculator</h2>

  <form onsubmit="calculate(event)">
    <input type="number" id="num1" placeholder="Enter number 1" required><br>
    <input type="number" id="num2" placeholder="Enter number 2" required><br>
    
    <select id="operator" required>
      <option value="+">+</option>
      <option value="-">-</option>
      <option value=""></option>
      <option value="/">/</option>
    </select><br>

    <input type="submit" value="Calculate"><br>
    <p id="result"></p>
  </form>

  <script>
    function calculate(e) {
      e.preventDefault(); // Prevent form refresh

      let num1 = parseFloat(document.getElementById('num1').value);
      let num2 = parseFloat(document.getElementById('num2').value);
      let op = document.getElementById('operator').value;
      let result;

      if (op === '+') result = num1 + num2;
      else if (op === '-') result = num1 - num2;
      else if (op === '*') result = num1 * num2;
      else if (op === '/') result = num2 !== 0 ? num1 / num2 : 'Error (Divide by 0)';

      document.getElementById('result').textContent = "Result: " + result;
    }
  </script>

</body>
</html>
